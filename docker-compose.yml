services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { if (rs.status().ok !== 1) quit(1); } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}); quit(1); } if (!db.hello().isWritablePrimary) quit(1);"]
      interval: 5s
      timeout: 5s
      retries: 30
    # Not published to the host by default; the app talks to it over the compose network.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      SERVE_CLIENT: "true"
      MONGO_URI: mongodb://mongo:27017/school_management?replicaSet=rs0
      JWT_SECRET: ${JWT_SECRET:-please_change_this_in_production}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5000}
      # Uploaded images live on a volume so they survive redeploys.
    volumes:
      - uploads-data:/app/server/uploads
    ports:
      - "5000:5000"

volumes:
  mongo-data:
  uploads-data:
